name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Python 3.12
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements/base.txt
            requirements/development.txt
            requirements/production.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes pkg-config default-libmysqlclient-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r requirements/development.txt \
            -r requirements/production.txt

      - name: Check release hygiene
        run: python deploy/scripts/check_release_hygiene.py

      - name: Run Django tests
        run: python manage.py test --settings=config.settings.test

      - name: Run Django system check
        run: python manage.py check --settings=config.settings.test

      - name: Check Gunicorn configuration
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: >-
          gunicorn --check-config
          --config deploy/gunicorn.conf.py
          config.wsgi:application

      - name: Compile Python source
        run: >-
          python -m compileall -q
          config aggregate surnasdes26 deploy/gunicorn.conf.py
