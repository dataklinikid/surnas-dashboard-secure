{% load static %}
<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Dashboard Survei{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'surnasdes26/app.css' %}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{% url 'aggregate:home' %}">Dashboard Survei</a>
    {% if user.is_authenticated %}
      <span>{{ user.get_username }}</span>
      <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button class="link-button" type="submit">Keluar</button>
      </form>
    {% endif %}
  </header>
  <main class="container">
    {% if messages %}
      {% for message in messages %}<div class="notice">{{ message }}</div>{% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
