{% extends "aggregate/base.html" %}
{% block title %}Masuk{% endblock %}
{% block content %}
<section class="login-card">
  <h1>Masuk</h1>
  {% if form.errors %}<div class="error">Username atau kata sandi tidak sesuai.</div>{% endif %}
  <form method="post" novalidate>
    {% csrf_token %}
    <label for="id_username">Username</label>
    {{ form.username }}
    <label for="id_password">Kata sandi</label>
    {{ form.password }}
    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
    <button class="button" type="submit">Masuk</button>
  </form>
</section>
{% endblock %}
